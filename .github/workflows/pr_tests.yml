# Run Puppet checks and test matrix on Pull Requests
# ------------------------------------------------------------------------------
#             NOTICE: **This file is maintained with puppetsync**
#
# This file is updated automatically as part of a puppet module baseline.
#
# The next baseline sync will overwrite any local changes to this file!
#
# ==============================================================================
#
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
#
---
name: PR Tests
'on':
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  puppet-syntax:
    name: 'Puppet Syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1  # ruby/setup-ruby@ec106b438a1ff6ff109590de34ddc62c540232e0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - run: "bundle exec rake syntax"

  puppet-style:
    name: 'Puppet Style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - run: "bundle exec rake lint"
      - run: "bundle exec rake metadata_lint"

  ruby-style:
    name: 'Ruby Style'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - run: |
          bundle show
          bundle exec rake rubocop

  file-checks:
    name: 'File checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - run: bundle exec rake check:dot_underscore
      - run: bundle exec rake check:test_file

  reference:
    name: 'REFERENCE.md freshness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: 'Check REFERENCE.md freshness'
        run: bundle exec rake validate:strings

  releng-checks:
    name: 'RELENG checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: 'Tags and changelogs'
        run: |
          bundle exec rake pkg:check_version
          bundle exec rake pkg:compare_latest_tag[,true]
          bundle exec rake pkg:create_tag_changelog
      - name: 'Test-build the Puppet module'
        run: 'bundle exec rake pupmod:build'

  spec-tests:
    name: 'Puppet Spec'
    needs: [puppet-syntax]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        puppet:
          # openvox 8 accepts openfact 6, but no OpenVox 8 AIO package ships
          # it, so pin the openfact the agent actually ships
          - label: 'OpenVox 8.x (Ruby 3.2)'
            puppet_version: '~> 8.0'
            openfact_version: '~> 5.0'
            ruby_version: '3.2.11'  # renovate: datasource=ruby-version depName=ruby
            experimental: false
          # OpenVox 9 release candidate; switch to '~> 9.0' and make blocking
          # (experimental: false) once 9.0.0 is released.
          - label: 'OpenVox 9.x RC (Ruby 4.0)'
            puppet_version: '>= 9.0.0.pre.rc1'
            openfact_version: '>= 5'
            ruby_version: '4.0.7'  # renovate: datasource=ruby-version depName=ruby
            experimental: true
      fail-fast: false
    env:
      PUPPET_VERSION: ${{matrix.puppet.puppet_version}}
      OPENFACT_VERSION: ${{matrix.puppet.openfact_version}}
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby ${{matrix.puppet.ruby_version}}'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.puppet.ruby_version}}
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - run: 'bundle exec rake parallel_spec'
        continue-on-error: ${{matrix.puppet.experimental}}

  acceptance:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        node:
          - almalinux9
          - almalinux10
      fail-fast: false
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.11
      - name: bundle install
        run: |
          bundle install
      - name: Setup libvirt for Vagrant
        run: |
          sudo add-apt-repository ppa:evgeni/vagrant
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vagrant vagrant-libvirt libvirt-daemon-system libvirt-daemon qemu-system-x86 qemu-utils dnsmasq
          sudo chmod 666 /var/run/libvirt/libvirt-sock
      - name: beaker
        env:
          BEAKER_HYPERVISOR: 'vagrant_libvirt'
          VAGRANT_DEFAULT_PROVIDER: 'libvirt'
        run: |
          bundle exec rake beaker:suites[default,${{ matrix.node }}]
